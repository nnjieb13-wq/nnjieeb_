<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>www.najiebabdurrahman.com</title>
    
    <style>
        /* Reset Dasar & Pilihan Font */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Latar belakang luar menggunakan gradasi biru-lavender lembut */
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        /* Wadah Utama (Kartu Profil) dengan Animasi Masuk */
        .profile-card {
            width: 100%;
            max-width: 600px;
            background: hwb(270 98% 1%);
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* ==================================================
           TAMBAHAN: BINGKAI FOTO PROFIL BULAT SEMPURNA
           ================================================== */
        .profile-avatar-box {
            width: 120px;
            height: 120px;
            background-color: hwb(260 98% 1%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            padding: 16px;
            overflow: hidden;
            border: 3px solid #ffffff;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .profile-avatar-box:hover {
            transform: scale(1.05) rotate(3deg);
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Memotong sisa tepian kotak logo agar membulat rapi */
            border-radius: 50%;
        }

        /* Bagian Judul Atas */
        .profile-header {
            text-align: center;
            margin-bottom: 35px;
            width: 100%;
        }

        .profile-header h1 {
            font-size: 24px;
            color: #1e3a8a; /* Biru tua elegan sesuai gambar */
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .profile-header .divider {
            width: 50px;
            height: 4px;
            background-color: #2563eb;
            border-radius: 2px;
            margin: 12px auto 0 auto;
        }

        /* Struktur List Data Pribadi */
        .info-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 35px;
            width: 100%;
        }

        /* Baris Data Ringkas */
        .info-row {
            display: grid;
            grid-template-columns: 180px 1fr;
            padding: 16px 20px;
            background-color: #f8fafc; /* Latar baris abu-abu lembut */
            border-left: 4px solid #2563eb; /* Aksen garis biru solid di kiri */
            border-radius: 4px 14px 14px 4px;
            align-items: center;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        /* Efek Interaktif saat Baris Data Didekati Kursor */
        .info-row:hover {
            transform: translateX(6px);
            background-color: #f1f5f9;
        }

        .info-label {
            font-weight: 600;
            color: #475569;
            font-size: 14.5px;
        }

        .info-value {
            color: #1e293b;
            font-size: 15px;
            font-weight: 600;
        }

        /* Footer Halaman & Area Tombol Navigasi */
        .profile-footer {
            display: flex;
            justify-content: center;
            border-top: 1px solid #f1f5f9;
            padding-top: 30px;
            width: 100%;
        }

        /* ANIMASI TOMBOL INTERAKTIF (HOVER EFFECT) */
        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            padding: 14px 32px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .btn-home .icon {
            transition: transform 0.3s ease;
        }

        /* Efek Hover Tombol (Tombol Naik + Efek Panah Bergerak) */
        .btn-home:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
        }

        .btn-home:hover .icon {
            transform: translateX(-4px);
        }

        /* Efek saat Tombol Diklik Aktif */
        .btn-home:active {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }

        /* Keyframes untuk Animasi Masuk Kartu */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(25px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Penyesuaian Tampilan Responsif untuk Layar HP */
        @media (max-width: 500px) {
            .profile-card {
                padding: 25px 20px;
            }
            .info-row {
                grid-template-columns: 1fr;
                gap: 6px;
            }
        }
    </style>
</head>
<body>

    <!-- Kartu Informasi Utama -->
    <div class="profile-card">
        
        <!-- FOTO PROFIL BULAT SEMPURNA SESUAI LOGO -->
        <div class="profile-avatar-box">
            <!-- Ganti 'logo.png' dengan file gambar/logo N ungu milik Anda -->
            <img src="foto profil.jpg" alt="Logo Najieb Abdurrahman" class="profile-img">
        </div>

        <!-- Bagian Judul -->
        <header class="profile-header">
            <h1>DATA PRIBADI</h1>
            <div class="divider"></div>
        </header>

        <!-- Bagian Isi Data Sesuai Gambar Terbaru -->
        <main class="info-list">
            <div class="info-row">
                <div class="info-label">Nama:</div>
                <div class="info-value">Najieb Abdurrahman</div>
            </div>
            
            <div class="info-row">
                <div class="info-label">Tempat/Tanggal lahir:</div>
                <div class="info-value">Cilacap, 13 Mei 2008</div>
            </div>
            
            <div class="info-row">
                <div class="info-label">Agama:</div>
                <div class="info-value">Islam</div>
            </div>
            
            <div class="info-row">
                <div class="info-label">Gol. Darah:</div>
                <div class="info-value">O</div>
            </div>
            
            <div class="info-row">
                <div class="info-label">Pekerjaan/Pelajar:</div>
                <div class="info-value">Pelajar</div>
            </div>
            
            <div class="info-row">
                <div class="info-label">Hobi:</div>
                <div class="info-value">Sepak Bola</div>
            </div>
        </main>

        <!-- Bagian Tombol Navigasi Balik -->
        <footer class="profile-footer">
            <a href="index.html" class="btn-home">
                <span class="icon">←</span> Kembali ke halaman utama
            </a>
        </footer>

    </div>

</body>
</html>
